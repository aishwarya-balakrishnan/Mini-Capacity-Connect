<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Programming Skill Test</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Programming Skill Test</h1>

        <h2 id="testCourse">Skill Test</h2>

        <p class="intro">
            Answer all the questions to check your programming knowledge.
        </p>

        <!-- Student Information -->
        <div class="student-info">

            <p>
                <strong>Name:</strong>
                <span id="studentName"></span>
            </p>

            <p>
                <strong>Register Number:</strong>
                <span id="studentRegister"></span>
            </p>

            <p>
                <strong>Department:</strong>
                <span id="studentDepartment"></span>
            </p>

            <p>
                <strong>Year:</strong>
                <span id="studentYear"></span>
            </p>

        </div>


        <!-- Skill Test -->
        <form id="skillTestForm">

            <!-- Questions will appear here -->
            <div id="questionsContainer"></div>

            <button type="submit">
                Submit Skill Test
            </button>

        </form>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
