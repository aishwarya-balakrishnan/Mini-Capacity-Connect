```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skill Test Result</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Skill Test Result</h1>

        <h2 id="resultCourse">
            Programming Skill Result
        </h2>


        <div class="result-box">

            <h3>Your Score</h3>

            <p id="skillScore" class="score">
                0 / 5
            </p>


            <h3>Your Skill Level</h3>

            <p id="skillLevel" class="level">
                -
            </p>


            <div class="progress-container">

                <h3>Your Skill Percentage</h3>

                <progress
                    id="skillProgress"
                    value="0"
                    max="100">
                </progress>

                <p id="skillPercentage">
                    0%
                </p>

            </div>


            <div class="recommendation">

                <h3>Recommendation</h3>

                <p id="recommendation">
                    Your recommendation will appear here.
                </p>

            </div>

        </div>


        <button onclick="startTestAgain()">
            Take Test Again
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
